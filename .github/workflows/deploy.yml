name: Build Ghibli experiment (manual only)

# NOTE (2026-09-08): automatic deploys on push to `main` were REMOVED.
# `main` holds an old Next.js "Ghibli" experiment. The live portfolio at
# https://anggitdjoko.github.io/portfolio/ is the static space-themed site on
# the `gh-pages` branch. Pushing to main used to trigger this workflow and
# overwrite that live site. Run it manually only if you really want to publish
# the Next.js build instead of the portfolio.

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx next build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
